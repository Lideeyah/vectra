name: price recorder

on:
  schedule:
    # Every five minutes. GitHub queues rather than guarantees this; the recorder
    # buckets by wall-clock time and dedupes, so a late run self-corrects.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own group, NOT shared with discovery. A shared group made GitHub cancel
  # pending scheduled runs, which cost 97% of the intended series. Push races
  # are handled by the rebase-and-retry loop below instead.
  group: price-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a fixed constituent set
        run: |
          if [ ! -f data/constituents.json ]; then
            echo "No data/constituents.json — run the 'discover constituents'" >&2
            echo "workflow first. The recorder never picks its own basket." >&2
            exit 1
          fi

      - name: Record
        # Records its own buckets for ~50 minutes rather than trusting cron to
        # fire. Cut off runs still reach the commit step below.
        timeout-minutes: 55
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
        run: python record.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"

          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi

          git add data
          git commit -m "record: $(date -u +%Y-%m-%dT%H:%MZ)"

          # A concurrent or late run may have pushed since checkout. Rebase and
          # retry rather than forcing, so no reading is ever overwritten.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done

          echo "Could not push after 5 attempts." >&2
          exit 1
