name: price recorder

on:
  schedule:
    # Every fifteen minutes. This is a RESTART trigger, not the clock — the job
    # records its own buckets internally. A */5 cron queued 288 pending runs a
    # day into one concurrency group, each cancelling the last, and a healthy
    # job was cancelled 3h44m into its run. Less churn, same coverage.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own group, NOT shared with discovery. A shared group made GitHub cancel
  # pending scheduled runs, which cost 97% of the intended series. Push races
  # are handled by the rebase-and-retry loop below instead.
  group: price-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a fixed constituent set
        run: |
          if [ ! -f data/constituents.json ]; then
            echo "No data/constituents.json — run the 'discover constituents'" >&2
            echo "workflow first. The recorder never picks its own basket." >&2
            exit 1
          fi

      - name: Record
        # Just under three hours. A 5.5 hour job was cancelled at 3h44m, so
        # runs now finish well inside that window rather than betting on it.
        # Cut off runs still reach the commit step below.
        timeout-minutes: 180
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
          # Commit every ~30 minutes during the run. A 5.5 hour job that dies
          # late must not lose everything it gathered.
          VECTRA_AUTOCOMMIT: "1"
        run: python record.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"

          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi

          git add data
          git commit -m "record: $(date -u +%Y-%m-%dT%H:%MZ)"

          # A concurrent or late run may have pushed since checkout. Rebase and
          # retry rather than forcing, so no reading is ever overwritten.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done

          echo "Could not push after 5 attempts." >&2
          exit 1
