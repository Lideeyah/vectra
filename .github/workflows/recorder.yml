name: price recorder

on:
  schedule:
    # Every fifteen minutes. This is a RESTART trigger, not the clock — the job
    # records its own buckets internally. A */5 cron queued 288 pending runs a
    # day into one concurrency group, each cancelling the last, and a healthy
    # job was cancelled 3h44m into its run. Less churn, same coverage.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own group, NOT shared with discovery.
  #
  # DO NOT manually "Run workflow" while a run is already in progress. A
  # workflow_dispatch is a HIGHER PRIORITY waiting request than a schedule, so
  # it cancels the running job:
  #     "Canceling since a higher priority waiting request for
  #      price-recorder exists"
  # That is what killed run #12 at 2h11m and another at 3h44m. Scheduled fires
  # queue harmlessly; manual ones displace. Only trigger manually when the
  # Actions tab shows no recorder in progress.
  group: price-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require a fixed constituent set
        run: |
          if [ ! -f data/constituents.json ]; then
            echo "No data/constituents.json — run the 'discover constituents'" >&2
            echo "workflow first. The recorder never picks its own basket." >&2
            exit 1
          fi

      - name: Record
        # Just under three hours. A 5.5 hour job was cancelled at 3h44m, so
        # runs now finish well inside that window rather than betting on it.
        # Cut off runs still reach the commit step below.
        timeout-minutes: 180
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
          # Commit every ~30 minutes during the run. A 5.5 hour job that dies
          # late must not lose everything it gathered.
          VECTRA_AUTOCOMMIT: "1"
        run: python record.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"

          # One shared implementation, because there were six copies of this
          # loop and all six swallowed a FAILED rebase — which leaves the tree
          # mid-rebase and every later git command broken.
          ./scripts/commit_data.sh "record: $(date -u +%Y-%m-%dT%H:%MZ)" data
