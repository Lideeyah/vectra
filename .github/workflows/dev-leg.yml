name: dev leg

# Executes a REAL leg against the REAL router on an anvil fork of X Layer, and
# exports the Executed logs.
#
# The machine here is the point: OKX is unreachable from the development laptop
# but reachable from an Actions runner, which the caller-binding work already
# proved. So the leg that cannot be run locally runs here, and the interface
# gets genuine event data of exactly the shape mainnet will produce — before the
# mainnet mandate is funded.
#
# This is development data. It is committed under data/dev/ so it is never
# mistaken for production, and the rendering code it exercises is the same code
# that will render mainnet events unchanged.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-leg
  cancel-in-progress: false

jobs:
  leg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Start anvil, forked from X Layer
        run: |
          anvil --fork-url https://rpc.xlayer.tech --port 8545 --silent &
          for i in $(seq 1 60); do
            cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break
            sleep 2
          done
          echo "forked chain $(cast chain-id --rpc-url http://127.0.0.1:8545) at block $(cast block-number --rpc-url http://127.0.0.1:8545)"
          # The block the fork starts at, which is where OUR history begins.
          # Everything before it belongs to the remote provider, and X Layer
          # caps eth_getLogs at a 100-block range — so a log query starting at
          # block 0 is not merely slow, it is REFUSED upstream. That refusal is
          # why the first successful leg exported zero events.
          echo "FORK_BLOCK=$(cast block-number --rpc-url http://127.0.0.1:8545)" >> "$GITHUB_ENV"

      - name: Move real NVDAx to the owner, by impersonation
        run: |
          set -euo pipefail
          R=http://127.0.0.1:8545
          WHALE=0xa8ddb5Cd96b5222AFe198316E9A57CAA642850D5
          OWNER=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          NVDAX=0xc845b2894dBddd03858fd2D643B4eF725fE0849d
          # forge script's --unlocked does not give a signer for an arbitrary
          # address; anvil's own impersonation does.
          cast rpc anvil_impersonateAccount $WHALE --rpc-url $R >/dev/null
          cast rpc anvil_setBalance $WHALE 0xde0b6b3a7640000 --rpc-url $R >/dev/null
          cast send $NVDAX "transfer(address,uint256)" $OWNER 8000000000000000000 \
            --from $WHALE --unlocked --rpc-url $R >/dev/null
          echo "owner NVDAx: $(cast call $NVDAX 'balanceOf(address)(uint256)' $OWNER --rpc-url $R)"

      - name: Deploy and seed a mandate that needs a sell
        id: seed
        run: |
          set -euo pipefail
          FOUNDRY_PROFILE=fork forge script script/DevLeg.s.sol --sig "setup()" \
            --rpc-url http://127.0.0.1:8545 --broadcast --unlocked \
            | tee /tmp/seed.log
          echo "VECTRA=$(grep -oE 'VECTRA 0x[0-9a-fA-F]{40}' /tmp/seed.log | tail -1 | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "MANDATE=$(grep -oE 'MANDATE [0-9]+' /tmp/seed.log | tail -1 | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "OWNER=$(grep -oE 'OWNER 0x[0-9a-fA-F]{40}' /tmp/seed.log | tail -1 | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Fetch a fresh payload and forward it, same job
        id: leg
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
        run: |
          set -euo pipefail
          NVDAX=0xc845b2894dbddd03858fd2d643b4ef725fe0849d
          USDC=0xb6ceceab302e2e4948951ee7843fc24e92933061
          AMOUNT_IN=1000000000000000000   # 1 NVDAx, in balance terms

          # The payload is built for the CONTRACT, because the calldata encodes
          # its caller — verified by the caller-binding run.
          VECTRA_WALLET="$VECTRA" VECTRA_FROM="$NVDAX" VECTRA_TO="$USDC" \
            VECTRA_AMOUNT="$AMOUNT_IN" python fetch_payload.py > /tmp/payload.env
          set -a; . /tmp/payload.env; set +a

          # minOut shaved: on a rebasing token an exact-quote minOut rounds a wei
          # short and reverts every time.
          MIN_OUT=$(( VECTRA_PAYLOAD_MINOUT - 1000 ))
          echo "payload fetched; minOut ${VECTRA_PAYLOAD_MINOUT} -> using ${MIN_OUT}"

          VECTRA="$VECTRA" MANDATE="$MANDATE" AMOUNT_IN="$AMOUNT_IN" \
            MIN_OUT="$MIN_OUT" VECTRA_PAYLOAD="$VECTRA_PAYLOAD" \
            FOUNDRY_PROFILE=fork forge script script/DevLeg.s.sol --sig "leg()" \
            --rpc-url http://127.0.0.1:8545 --broadcast --unlocked | tee /tmp/leg.log

      # The owner's controls, signed for real against this fork. Rendering a
      # Pause button proves nothing; this asserts each one changes the state the
      # contract reports, and that revoking the mandate leaves the USDC
      # allowance standing — a claim the interface makes in words.
      #
      # Runs AFTER the leg, so the leg executes against a live mandate, and
      # before the export, so the export also captures the real TargetsSet
      # amendment this produces.
      - name: Owner controls, end to end
        id: controls
        run: |
          set -euo pipefail
          cd web
          npm ci
          RPC=http://127.0.0.1:8545 VECTRA="$VECTRA" npx tsx scripts/e2e-controls.ts

      - name: Export the Executed logs
        if: always()
        run: |
          # Deliberately NOT `set -u`. This step exists to report what happened,
          # including when nothing did, and an unbound VECTRA from a failed seed
          # must not kill the reporting — that is how the last run produced no
          # output at all and left the failure invisible.
          set +u
          mkdir -p data/dev

          {
            echo "# dev leg — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "contract: ${VECTRA:-<seed did not report one>}"
            echo "mandate:  ${MANDATE:-<none>}"
            echo
            echo "## seed"
            echo '```'
            tail -40 /tmp/seed.log 2>/dev/null || echo "(no seed log — the step did not run)"
            echo '```'
            echo "## leg"
            echo '```'
            tail -60 /tmp/leg.log 2>/dev/null || echo "(no leg log — the step did not run)"
            echo '```'
          } > data/dev/run.md

          if [ -z "${VECTRA:-}" ]; then
            echo "no contract address — seed failed; diagnostics written to data/dev/run.md"
            echo "[]" > data/dev/executed.json
            echo "[]" > data/dev/targets_set.json
            exit 0
          fi

          # From the fork block, never from 0. See the anvil step: the upstream
          # provider refuses ranges wider than 100 blocks, and the previous
          # version piped that refusal into `|| echo "[]"`, so a hard error and
          # a genuinely quiet run produced byte-identical output. Errors are
          # kept and reported here instead of being converted into emptiness.
          FROM="${FORK_BLOCK:-0}"
          echo "querying logs for $VECTRA from block $FROM"

          fetch() {   # fetch <event-signature> <outfile>
            local out="data/dev/$2"
            if cast logs "$(cast sig-event "$1")" --address "$VECTRA" \
                 --from-block "$FROM" --rpc-url http://127.0.0.1:8545 --json \
                 > "$out" 2> "/tmp/$2.err"; then
              return 0
            fi
            echo "LOG QUERY FAILED for $1:"
            cat "/tmp/$2.err"
            { echo; echo "## log query failure ($1)"; echo '```';
              cat "/tmp/$2.err"; echo '```'; } >> data/dev/run.md
            echo "[]" > "$out"
            return 1
          }

          rc=0
          fetch "Executed(uint256,address,address,uint256,uint256,uint64)" executed.json || rc=1
          fetch "TargetsSet(uint256,uint256[],uint256[],uint64,uint256)" targets_set.json || rc=1

          python tools/decode_legs.py data/dev | tee /tmp/decoded.txt
          { echo; echo "## decoded"; echo '```'; cat /tmp/decoded.txt; echo '```'; } >> data/dev/run.md

          # The check that can fail. A leg step that reported success while the
          # export produced no Executed log means one of the two is lying, and
          # the whole point of this run is the event data — so an empty export
          # after a successful leg is a failure, not a quiet pass.
          LEGS=$(python -c "import json;print(len(json.load(open('data/dev/history.json'))['legs']))")
          echo "legs decoded: $LEGS"
          if [ "${{ steps.leg.outcome }}" = "success" ] && [ "$LEGS" -eq 0 ]; then
            echo "::error::the leg step succeeded but exported zero Executed logs"
            rc=1
          fi
          exit $rc

      - name: Commit the development event data
        if: always()
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"
          # data/dev/run.md is rewritten every run, so there is always
          # something to commit and never a silent success.
          [ -z "$(git status --porcelain data/dev)" ] && echo "nothing new" && exit 0
          git add data/dev
          git commit -m "dev-leg: executed logs $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          exit 1
