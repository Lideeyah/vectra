name: caller binding

# Fetches a fresh swap payload for the PREDICTED contract address and forwards
# it through a contract deployed at that same address in a fork — in ONE job,
# seconds apart. The router enforces a deadline, so a payload routed through a
# commit and a human has four chances to expire before it is used.
#
# Read-only against mainnet: the fork is local, nothing is signed or broadcast.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Predicted contract address the payload is built for"
        required: false
        default: "0x08Ed8562e2fD44C82EBA0CDfbC6F5Fdca3Cf19a0"
      fork_block:
        description: "Block to pin the fork to (blank = latest)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: caller-binding
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1

      # Reuse fetched chain state between runs. The public X Layer RPC times out
      # refetching the router's storage, which is a 13KB contract.
      - name: Cache the fork
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache
          key: foundry-xlayer-${{ inputs.fork_block || 'latest' }}
          restore-keys: foundry-xlayer-

      - name: Fetch payload and forward it, same job
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
          VECTRA_WALLET: ${{ inputs.address }}
          # The recorded deployment hash. The fork test asserts the code it runs
          # against hashes to this, so a drifted artifact fails loudly instead of
          # being silently exercised.
          VECTRA_DEPLOY_HASH: "0xc20f87eccd8af42fa47608d1c60b4cce916df43dce508670876ab6a8c6479db9"
        run: |
          set -euo pipefail

          # Build the DEPLOYMENT artifact under the default profile first. The
          # fork tests etch it rather than recompiling under cancun.
          forge build
          echo "fetching a payload for ${VECTRA_WALLET}"
          python fetch_payload.py > /tmp/payload.env
          # The address the payload was built for, asserted by the test.
          echo "VECTRA_PAYLOAD_WALLET=${VECTRA_WALLET}" >> /tmp/payload.env

          set -a; . /tmp/payload.env; set +a
          echo "payload fetched, ${#VECTRA_PAYLOAD} hex chars; forwarding now"

          FORK_ARGS="--fork-url https://rpc.xlayer.tech"
          if [ -n "${{ inputs.fork_block }}" ]; then
            FORK_ARGS="$FORK_ARGS --fork-block-number ${{ inputs.fork_block }}"
          fi

          # The OUTCOME is durable and worth committing; the PAYLOAD is
          # perishable and must not be. Capture the test output, strip anything
          # carrying calldata, and commit only the verdict.
          set +e
          FOUNDRY_PROFILE=fork FOUNDRY_NO_MATCH_PATH= forge test \
            --match-path "test/fork/CallerBinding.t.sol" \
            $FORK_ARGS -vvvv 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          set -e

          mkdir -p data/verifications
          {
            echo "# Caller binding"
            echo
            echo "- ran: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- address: ${VECTRA_WALLET}"
            echo "- fork block: ${{ inputs.fork_block || 'latest' }}"
            echo "- exit: ${RC} ($([ $RC -eq 0 ] && echo PASS || echo FAIL))"
            echo
            echo '```'
            # set -e with pipefail is active, and grep exits 1 when it matches
            # nothing, which aborts the step before the commit and leaves no
            # verdict at all. That is what happened on the first run.
            grep -vE "VECTRA_PAYLOAD=|0x[0-9a-fA-F]{200,}" /tmp/result.log \
              | tail -150 || true
            echo '```'
          } > data/verifications/caller_binding.md

          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"
          git add data/verifications/caller_binding.md
          git commit -m "caller-binding: $([ $RC -eq 0 ] && echo pass || echo fail) $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done

          exit $RC
