name: agent cycle

# Manual only, and DRY RUN: it computes the leg it would take and logs it.
# Nothing is signed or sent — the contract is not deployed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Deliberately NOT the recorder's group. A workflow_dispatch outranks a
  # scheduled run and would cancel the recorder mid-flight if they shared one.
  group: agent-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one cycle
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
        run: python agent.py

      - name: Commit the cycle log
        if: always()
        run: |
          ./scripts/commit_data.sh "agent: cycle $(date -u +%Y-%m-%dT%H:%MZ)" data
