[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
# Fork tests need --fork-url xlayer and are excluded from the default run.
no_match_path = "test/ForkXLayer.t.sol"
fs_permissions = [{ access = "read", path = "./data" }]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
