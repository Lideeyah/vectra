[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Pinned, not inherited. Foundry's default tracks the newest EVM version, so an
# unpinned build can emit opcodes a zkEVM may not implement, and a rebuild under
# a later Foundry would produce different bytecode against an immutable address
# that can no longer be redeployed. Paris avoids PUSH0 and every Cancun opcode.
evm_version = "paris"
via_ir = false
# Fork tests need --fork-url xlayer and are excluded from the default run.
no_match_path = "test/(ForkXLayer|RealRouter).t.sol"
fs_permissions = [{ access = "read", path = "./data" }]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
